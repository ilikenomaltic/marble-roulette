<div id=settings class=settings>
  <div class=right>
    <button id=btnToggleSettings class=btn-toggle-settings>
      <span data-trans>Settings</span>
      <i class=toggle-arrow>▲</i>
    </button>
    <div class="collapsed collapsible-rows">
      <div class=row>
        <label for=sltMap>
          <i class="icon map"></i>
          <span data-trans>Map</span>
        </label>
        <select id=sltMap></select>
      </div>
      <div class="row row-toggles">
        <div class=toggle-item>
          <label for=chkAutoRecording>
            <i class="icon record"></i>
            <span data-trans>Recording</span>
          </label>
          <input type=checkbox id=chkAutoRecording>
        </div>
        <div class=toggle-item>
          <label for=chkSkill>
            <i class="bomb icon"></i>
            <span data-trans>Using skills</span>
          </label>
          <input type=checkbox id=chkSkill checked>
        </div>
      </div>
      <div class=row>
        <label>
          <i class="icon trophy"></i>
          <span data-trans>The winner is</span>
        </label>
        <div class=btn-group>
          <button class="active btn-first-winner btn-winner" data-trans>First</button>
          <button class="btn-last-winner btn-winner" data-trans>Last</button>
          <input type=number id=in_winningRank value=1 min=1>
        </div>
      </div>
      <div class="row row-theme">
        <div class=theme>
          <i class="icon sun"></i>
          <input type=checkbox id=chkDarkMode checked>
          <i class="icon moon"></i>
        </div>
      </div>
      <div class="row row-group">
        <label>
          <span>👥 조 편성</span>
        </label>
        <div class=group-toggle-wrap>
          <input type=checkbox id=chkGroupMode>
          <div class=group-size-btns id=groupSizeBtns style=display:none>
            <button class=btn-group-size data-size=2>2명</button>
            <button class="active btn-group-size" data-size=3>3명</button>
            <button class=btn-group-size data-size=4>4명</button>
          </div>
        </div>
      </div>
      <div class="row row-autofill" id=autofillRow>
        <label>
          <span>🔢 자동 입력</span>
        </label>
        <div class=autofill-wrap>
          <input type=number id=studentCountInput min=1 max=100 value=10>
          <span class=autofill-unit>명</span>
          <button id=btnAutoFill>입력</button>
        </div>
      </div>
    </div>
  </div>
  <div class=left>
    <h3 data-trans>Enter names below</h3>
    <textarea id=in_names placeholder="Input names separated by commas or line feed here" data-trans=placeholder>수박*2,키위*2,귤*2</textarea>
    <div class=actions>
      <button id=btnNotice>
        <i class="icon megaphone"></i>
      </button>
      <a href=https://marblerouletteshop.com target=_blank id=btnShop class="btn new" title="MarbleRoulette Shop">
        <img src=marblerouletteshop.png>
      </a>
      <div class=sep></div>
      <button id=btnShuffle>
        <i class="icon shuffle"></i>
        <span data-trans>Shuffle</span>
      </button>
      <button id=btnStart>
        <i class="icon play"></i>
        <span data-trans>Start</span>
      </button>
    </div>
  </div>
</div>
<div id=notice>
  <h1>Notice</h1>
  <div class=notice-body>
    <h2>50% 할인 행사</h2>
    <a href=https://marblerouletteshop.com/news/1>
      <img style=width:100% src=sale.jpg>
    </a>
    <p>
      저작권 등록을 기념하여 전 상품 50% 할인 행사를 진행합니다.<br>
      감사합니다!
    </p>
  </div>
  <div class=notice-action>
    <button id=closeNotice data-trans>Close</button>
  </div>
</div>

<div id=teacherModal>
  <div class=teacher-box>
    <div class=teacher-header>
      <h3>⚙️ 고급 설정</h3>
      <button class=btn-close-header id=closeTeacherModal>✕</button>
    </div>
    <p class=teacher-desc>같은 조에 배정되지 않을 쌍을 설정합니다.</p>
    <div class=teacher-input-row>
      <input id=conflictA placeholder="이름 1" autocomplete=off>
      <span class=vs>↔</span>
      <input id=conflictB placeholder="이름 2" autocomplete=off>
      <button id=addConflictBtn class=btn>추가</button>
    </div>
    <div class=conflict-list id=conflictList></div>
    <div class=teacher-footer>
      <button class=btn-clear id=clearConflictsBtn>전체 삭제</button>
      <button class=btn-save id=saveTeacherBtn>저장</button>
    </div>
  </div>
</div>


<div id=groupResultPanel>
  <div class=group-result-box>
    <h2>🎉 조 편성 결과</h2>
    <div class=group-grid id=groupResultGrid></div>
    <button class=btn-close-result id=closeGroupResultBtn>확인</button>
  </div>
</div>
